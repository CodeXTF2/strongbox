[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/fido",
    "crates/client",
    "crates/server",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
strongbox-core = { path = "crates/core" }
strongbox-proto = { path = "crates/proto" }
strongbox-fido = { path = "crates/fido" }
strongbox-client = { path = "crates/client" }

anyhow = "1.0.86"
argon2 = { version = "0.5.3", features = ["zeroize"] }
axum = "0.8.4"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
ciborium = "0.2.2"
clap = { version = "4.5.20", features = ["derive", "env"] }
ed25519-dalek = "2.1.1"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
rand = "0.8.5"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.3.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1.0.128"
sha2 = "0.10.8"
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = ["full"] }
tower-http = { version = "0.6.1", features = ["limit", "trace", "cors"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
zeroize = { version = "1.8.1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
